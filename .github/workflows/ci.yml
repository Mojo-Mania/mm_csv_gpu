name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hosted runners have no GPU, so the twelve tests cannot run here -- they need a
# real device and are run before every push (`pixi run test`, about a second).
#
# What CI *can* do is compile the kernels, which is where this library has
# actually broken: `std.memory.pack_bits` took Metal's shader compiler down
# with no diagnostic, and nothing but device codegen would have caught it.
# `mojo build --target-accelerator` names the architecture rather than asking
# the machine for one, so a runner with no GPU can still generate code for
# four of them -- including two nobody here owns.
jobs:
  kernels:
    name: kernels for ${{ matrix.accelerator }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, accelerator: "metal:4" }
          - { os: macos-latest, accelerator: "metal:1" }
          - { os: ubuntu-latest, accelerator: "sm_80" }
          - { os: ubuntu-latest, accelerator: "gfx942" }
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      # The test binary pulls in the whole library, so compiling it compiles
      # every kernel. The output is echoed into an annotation as well as the
      # log, because annotations are readable from the public API and logs
      # are not.
      - name: Compile the kernels
        shell: bash
        run: |
          set -o pipefail
          if ! pixi run mojo build --target-accelerator='${{ matrix.accelerator }}' \
              -I . test/test_csv_gpu.mojo -o "$RUNNER_TEMP/test_csv_gpu" \
              2>&1 | tee "$RUNNER_TEMP/build.log"; then
            echo "::error title=build output::$(tail -c 1500 "$RUNNER_TEMP/build.log" | tr '\n%\r' '  ')"
            exit 1
          fi

  lint:
    name: format and docstrings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Check formatting
        run: |
          pixi run format
          git diff --exit-code

      - name: Check docstrings
        run: pixi run docs

  build:
    name: build package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # The pixi-build-mojo backend speaks pixi-build-api-version 7, which
          # needs pixi >= 0.80. An older pixi does not fail on the version --
          # it silently falls back to a 2025 backend that calls the removed
          # `mojo package -o *.mojopkg`.
          pixi-version: v0.80.0
          cache: true

      - name: Build the conda package
        run: pixi build

      - name: Check a package was produced
        shell: bash
        run: |
          shopt -s nullglob
          pkgs=(./*.conda)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "pixi build produced no .conda package" >&2
            exit 1
          fi
          ls -lh "${pkgs[@]}"
