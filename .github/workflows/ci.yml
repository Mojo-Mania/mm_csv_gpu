name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests need a GPU, which hosted runners do not have. What CI can prove
  # is that everything compiles for the host and that the kernels compile for
  # the device, which is where this library has actually broken: `pack_bits`
  # took Metal's shader compiler down with no diagnostic.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      # Diagnostic: annotations are readable from the public API and logs
      # are not. Whether a GPU-less runner can compile a target that launches
      # kernels at all is the open question; this says what it says.
      - name: Build the tests
        id: buildtests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if ! pixi run mojo build -I . test/test_csv_gpu.mojo \
              -o "$RUNNER_TEMP/test_csv_gpu" 2>&1 | tee "$RUNNER_TEMP/b.log"; then
            echo "::error title=build output::$(tail -c 1500 "$RUNNER_TEMP/b.log" | tr '\n%\r' '  ')"
            exit 1
          fi

      - name: Build the package, which needs no device
        run: pixi build

  lint:
    name: format and docstrings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Check formatting
        run: |
          pixi run format
          git diff --exit-code

      - name: Check docstrings
        run: pixi run docs
